worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 文件上传大小限制（项目里有头像、附件上传）
    client_max_body_size 100m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 后端容器，名字由 docker compose 的服务名解析
    upstream continew-backend {
        server continew-server:18000;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # 前端静态资源：带 hash 的文件长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 接口反代：/api/auth/login -> http://continew-server:8000/auth/login
        # proxy_pass 末尾带斜杠 = 剥掉 /api 前缀
        # ^~ 不能省：nginx 的正则 location 优先级高于前缀 location，
        # 没有它的话 /api/nextdoc/_app.config.js 这类接口文档的静态资源会被上面的
        # 正则（\.js|\.css…）抢走，去本地目录找不到 → 404，表现为文档页面空白。
        location ^~ /api/ {
            proxy_pass http://continew-backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # WebSocket（右上角消息通知用到）
        location /websocket {
            proxy_pass http://continew-backend/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA 前端路由：刷新页面不 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
