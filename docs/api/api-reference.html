  .req-no { color: #94a3b8; }
  .muted { color: #94a3b8; }

<script>
const spec = JSON.parse(document.getElementById('spec').textContent);
const schemas = spec.components.schemas || {};
const groups = [];
const byTag = new Map();

for (const [path, ops] of Object.entries(spec.paths)) {
  for (const [method, op] of Object.entries(ops)) {
    const tag = (op.tags && op.tags[0]) || '其他';
    const item = {
      method: method.toUpperCase(), path, op,
      perm: ((op['x-nextdoc4j-security'] || {}).permissions || []).map(p => p.values.join(' ')).join(', ')
    };
    if (!byTag.has(tag)) { byTag.set(tag, []); groups.push(tag); }
    byTag.get(tag).push(item);
  }
}
const ORDER = ['工单管理 API', '认证 API', '验证码 API'];
const ITEM_ORDER = [
  'POST /ticket/manage',
  'GET /ticket/manage',
  'GET /ticket/manage/{id}',
  'PUT /ticket/manage/{id}',
  'DELETE /ticket/manage/{id}',
  'DELETE /ticket/manage',
  'POST /ticket/manage/{id}/classify',
  'GET /ticket/manage/statistics',
  'GET /ticket/manage/export'
];
groups.sort((a, b) => {
  const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
});
groups.forEach(g => byTag.get(g).sort((x, y) => {
  const ix = ITEM_ORDER.indexOf(x.method + ' ' + x.path);
  const iy = ITEM_ORDER.indexOf(y.method + ' ' + y.path);
  return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy);
}));
const flat = [];
groups.forEach(g => byTag.get(g).forEach(i => flat.push(i)));

/* ---------- 工具 ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ref(name) { return schemas[name] || null; }
function typeOf(s) {
  if (!s) return '-';
  if (s.$ref) return s.$ref.split('/').pop();
  if (s.type === 'array') return typeOf(s.items) + '[]';
  return s.type || '-';
}
function typeLabel(s) {
  const t = typeOf(s);
  const map = {string:'string',integer:'int',int32:'int',int64:'long',number:'double',boolean:'bool','-':'-'};
  return map[t] || t;
}
function propsOf(s) {
  if (!s) return [];
  if (s.$ref) { const r = ref(s.$ref.split('/').pop()); return r ? propsOf(r) : []; }
  return Object.entries(s.properties || {}).map(([k, v]) => [k, v, (s.required || []).includes(k)]);
}
function schemaTable(s, emptyText) {
  const rows = propsOf(s);
  if (!rows.length) return `<p class="muted" style="font-size:12.5px;margin:6px 0 0">${emptyText || '无字段'}</p>`;
  return `<table><thead><tr><th style="width:26%">字段</th><th style="width:16%">类型</th><th style="width:9%">必填</th><th>说明</th></tr></thead><tbody>` +
    rows.map(([k, v, req]) => {
      let note = v.description || '';
      if (v.example !== undefined) note += (note ? '　' : '') + `<span class="muted">示例：${esc(JSON.stringify(v.example))}</span>`;
      if (v.maxLength) note += `　<span class="muted">≤${v.maxLength} 字</span>`;
      if (v.enum) note += `　<span class="muted">可选值：${v.enum.join(' / ')}</span>`;
      return `<tr><td class="name">${esc(k)}</td><td class="type">${esc(typeLabel(v))}</td>` +
             `<td class="req">${req ? '<span class="req-yes">是</span>' : '<span class="req-no">否</span>'}</td><td>${note}</td></tr>`;
    }).join('') + '</tbody></table>';
}

/* 从 schema 里造一个示例对象，让响应示例不是空壳 */
function sampleOf(s, depth = 0) {
  if (!s || depth > 3) return null;
  if (s.$ref) return sampleOf(ref(s.$ref.split('/').pop()), depth + 1);
  if (s.type === 'array') return [sampleOf(s.items, depth + 1)];
  if (s.type !== 'object') return s.example !== undefined ? s.example : null;
  const out = {};
  for (const [k, v] of Object.entries(s.properties || {})) {
    // 「留空则由 AI 判定」这类字段不该出现在示例里，否则调用方会绕过 AI
    if ((v.description || '').includes('留空')) continue;
    let val = sampleOf(v, depth + 1);
    if (val === null && v.type === 'integer') val = 0;
    if (val === null && v.type === 'number') val = 0;
    if (val === null && v.type === 'string') val = v.example || '';
    if (val === null && v.type === 'boolean') val = false;
    out[k] = val;
  }
  return out;
}

function curlFor(item, token) {
  const url = 'http://134.175.137.18/api' + item.path;
  const lines = [`curl -X ${item.method} '${url}'`];
  if (token) lines.push(`  -H 'Authorization: Bearer ${token}'`);
  else lines.push(`  -H 'Authorization: Bearer <accessToken>'`);
  const bodyRef = item.op.requestBody && item.op.requestBody.content['application/json'];
  if (bodyRef) {
    lines.push(`  -H 'Content-Type: application/json'`);
    const sample = sampleOf(bodyRef.schema) || {};
    lines.push(`  -d '${JSON.stringify(sample, null, 2)}'`);
  }
  return lines.join(' \\\n');
}

/* ---------- 渲染 ---------- */
function renderNav(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '';
  groups.forEach(g => {
    const list = byTag.get(g).filter(i =>
      !f || i.path.toLowerCase().includes(f) || (i.op.summary || '').toLowerCase().includes(f));
    if (!list.length) return;
    html += `<div class="group-title">${esc(g)}</div>`;
    list.forEach(i => {
      html += `<div class="nav-item" data-path="${esc(i.path)}" data-m="${i.method}">
        <span class="m m-${i.method.toLowerCase()}">${i.method}</span>
        <span class="p">${esc(i.op.summary || i.path)}</span></div>`;
    });
  });
  document.getElementById('nav').innerHTML = html || '<p class="hint" style="padding:12px">没有匹配的接口</p>';
  document.querySelectorAll('.nav-item').forEach(el => {
    el.onclick = () => select(el.dataset.path, el.dataset.m);
  });
  if (current) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.path === current.path && el.dataset.m === current.method);
    });
  }
}

let current = null;
function select(path, method) {
  const item = flat.find(i => i.path === path && i.method === method);
  if (!item) return;
  current = item;
  const op = item.op;
  const token = document.getElementById('token').value.trim();
  const bodyRef = op.requestBody && op.requestBody.content['application/json'];
  const okResp = (op.responses['200'] || {}).content;
  const respSchema = okResp ? Object.values(okResp)[0].schema : null;

  let html = `<div class="crumb">${esc((op.tags || [])[0] || '')} / ${esc(op.summary || '')}</div>`;
  html += `<h2 class="title">${esc(op.summary || item.path)}</h2>`;
  html += `<div class="endpoint"><span class="verb m-${item.method.toLowerCase()}">${item.method}</span>
      <span class="path mono">${esc(item.path)}</span></div>`;
  if (op.description && op.description !== op.summary) html += `<p class="desc">${esc(op.description)}</p>`;
  html += '<div class="badges">';
  html += `<span class="badge">需登录 · Bearer Token</span>`;
  if (item.perm) html += `<span class="badge">权限 ${esc(item.perm)}</span>`;
  if (op.security === undefined || (Array.isArray(op.security) && op.security.length === 0))
    html += `<span class="badge warn">匿名可访问</span>`;
  html += '</div>';

  const params = (op.parameters || []).filter(p => p.in !== 'header');
  if (params.length) {
    html += '<h3 class="sec">请求参数</h3><table><thead><tr><th style="width:24%">名称</th><th style="width:10%">位置</th><th style="width:14%">类型</th><th style="width:9%">必填</th><th>说明</th></tr></thead><tbody>';
    params.forEach(p => {
      let note = p.description || '';
      if (p.schema && p.schema.example !== undefined) note += `　<span class="muted">示例：${esc(JSON.stringify(p.schema.example))}</span>`;
      if (p.schema && p.schema.maximum !== undefined) note += `　<span class="muted">≤${p.schema.maximum}</span>`;
      html += `<tr><td class="name">${esc(p.name)}</td><td>${esc(p.in)}</td><td class="type">${esc(typeLabel(p.schema))}</td>` +
        `<td class="req">${p.required ? '<span class="req-yes">是</span>' : '<span class="req-no">否</span>'}</td><td>${note}</td></tr>`;
    });
    html += '</tbody></table>';
  }

  if (bodyRef) {
    html += '<h3 class="sec">请求体 · application/json</h3>';
    html += schemaTable(bodyRef.schema);
  }

  html += '<h3 class="sec">调用示例</h3><div class="codewrap"><pre id="curl">' + esc(curlFor(item, token)) + '</pre>' +
    '<button class="copy" onclick="copyCurl()">复制</button></div>';
  if (!token) html += '<p class="hint" style="margin-top:6px">顶部填入 accessToken 后，示例里的占位符会自动替换。</p>';

  if (respSchema) {
    // 外层是统一信封 R*，真正有意义的是 data 的结构
    const wrapName = respSchema.$ref ? respSchema.$ref.split('/').pop() : '';
    const wrapDef = ref(wrapName);
    const isWrapper = wrapDef && wrapDef.properties && wrapDef.properties.data;
    const dataSchema = isWrapper ? wrapDef.properties.data : respSchema;

    html += '<h3 class="sec">响应数据 · data</h3>';
    if (isWrapper) {
      html += `<p class="hint" style="margin:0 0 8px">外层固定为 { code, msg, success, timestamp, data }，下表是 <span class="mono">data</span> 的结构。</p>`;
    }
    html += schemaTable(dataSchema, '该接口不返回业务数据（data 为 null）');
    const s = sampleOf(dataSchema);
    if (s !== null) html += '<div class="codewrap" style="margin-top:10px"><pre>' +
      esc(JSON.stringify({ code: '0', msg: 'ok', success: true, timestamp: Date.now(), data: s }, null, 2)) +
      '</pre></div>';
  }

  document.getElementById('view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.path === path && el.dataset.m === method);
  });
  document.querySelector('main').scrollTop = 0;
}

function copyCurl() {
  const text = document.getElementById('curl').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const b = document.querySelector('.copy');
    b.textContent = '已复制';
    setTimeout(() => b.textContent = '复制', 1200);
  });
}

document.getElementById('q').addEventListener('input', e => renderNav(e.target.value));
const tokenInput = document.getElementById('token');
tokenInput.value = localStorage.getItem('api_token') || '';
tokenInput.addEventListener('input', () => {
  localStorage.setItem('api_token', tokenInput.value);
  if (current) select(current.path, current.method);
});

renderNav();
select(flat[0].path, flat[0].method);
</script>
</body>
</html>
